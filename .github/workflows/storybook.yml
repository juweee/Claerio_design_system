# Build Storybook and publish it to GitHub Pages.
#
# Runs on every push to main, and on demand from the Actions tab.
# One-time setup: in the repository, go to Settings > Pages and set
# Source to "GitHub Actions".

name: Publish Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these to publish. Nothing else is allowed.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, finish the running publish first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install packages exactly as locked
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Build Storybook
        run: npm run build-storybook

      - name: Prepare Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload the built Storybook
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
